name: Application and active contracts
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm run contracts:check
      - run: npm test
      - run: npm run build
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser jury scenarios at desktop and mobile widths
        run: |
          npm run preview > /tmp/cqa-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          python tests/browser_jury_flow.py --url http://127.0.0.1:4173/
